name: Build VertictHub Studio (ARM64 Offline APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04

    env:
      CPYTHON_VERSION: "3.14.10"
      CPYTHON_SHA256: "423c80b957330cf0ebb92b9b20f2294c292144a441bdb0ceb8c69d14928e569b"
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: 4. Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: 5. Download & Validate CPython 3.14.10 Android AArch64 Package
        run: |
          mkdir -p /tmp/cpython_pkg /tmp/cpython_extract
          ARCHIVE="/tmp/cpython_pkg/cpython-3.14.10-android-aarch64.tar.gz"
          URL_PRIMARY="https://www.python.org/ftp/python/3.14.10/python-3.14.10-aarch64-linux-android.tar.gz"
          URL_ALT="https://www.python.org/ftp/python/3.14.10/python-3.14.10-android-aarch64.tar.gz"

          if curl -fsSL "$URL_PRIMARY" -o "$ARCHIVE"; then
            echo "Downloaded $URL_PRIMARY"
          elif curl -fsSL "$URL_ALT" -o "$ARCHIVE"; then
            echo "Downloaded $URL_ALT"
          else
            RESOLVED_URL=$(python3 scripts/resolve_cpython_url.py)
            echo "Resolved URL: $RESOLVED_URL"
            curl -fL "$RESOLVED_URL" -o "$ARCHIVE"
          fi

          echo "${CPYTHON_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xf "$ARCHIVE" -C /tmp/cpython_extract

          PREFIX_DIR=$(find /tmp/cpython_extract -maxdepth 3 -type d -name "prefix" | head -n 1)
          if [ -z "$PREFIX_DIR" ]; then
            LIB_FILE=$(find /tmp/cpython_extract -name "libpython3.14.so*" | head -n 1)
            PREFIX_DIR=$(dirname "$(dirname "$LIB_FILE")")
          fi
          echo "Resolved CPython prefix: $PREFIX_DIR"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p native/python314/include
          mkdir -p app/src/main/assets/python/stdlib

          cp -L "$PREFIX_DIR"/lib/libpython3.14.so app/src/main/jniLibs/arm64-v8a/libpython3.14.so
          cp -r "$PREFIX_DIR"/include/python3.14 native/python314/include/
          cp -r "$PREFIX_DIR"/lib/python3.14/* app/src/main/assets/python/stdlib/

          if [ -d app/src/main/assets/python/stdlib/lib-dynload ]; then
            for sofile in app/src/main/assets/python/stdlib/lib-dynload/*.so; do
              [ -e "$sofile" ] || continue
              base=$(basename "$sofile")
              modname="${base%%.*}"
              cp -L "$sofile" "app/src/main/jniLibs/arm64-v8a/libvh_ext_${modname}.so"
            done
          fi

      - name: 6. Cross-Compile PyCryptodome for Android ARM64 (CPython 3.14)
        run: |
          pip download --no-binary=:all: --dest /tmp/pycrypto_src "pycryptodome==3.21.0"
          tar -xzf /tmp/pycrypto_src/pycryptodome-3.21.0.tar.gz -C /tmp/pycrypto_src
          python3 "${GITHUB_WORKSPACE}/scripts/cross_compile_pycryptodome.py"

          mkdir -p "${GITHUB_WORKSPACE}/app/src/main/assets/python/site-packages"
          cp -r /tmp/pycrypto_src/pycryptodome-3.21.0/lib/Crypto "${GITHUB_WORKSPACE}/app/src/main/assets/python/site-packages/"
          python3 "${GITHUB_WORKSPACE}/scripts/package_pycryptodome.py"

      - name: 7. Validate Runtime Spec, Dependency Manifest & Core Modules
        run: |
          python3 scripts/verify_runtime.py
          python3 scripts/verify_dependencies.py
          python3 scripts/verify_core.py

      - name: 8. Build Native ARM64 JNI & Android APK
        run: |
          gradle assembleRelease --max-workers=2 --stacktrace

      - name: 9. Verify ARM64 ELF Binaries & Package Artifacts
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK output tidak ditemukan!"
            exit 1
          fi
          cp "$APK_PATH" dist/VertictHub-Studio.apk

          file app/src/main/jniLibs/arm64-v8a/libpython3.14.so | grep -q "ARM aarch64"
          unzip -p dist/VertictHub-Studio.apk lib/arm64-v8a/libverticthub_jni.so > /tmp/libverticthub_jni.so && file /tmp/libverticthub_jni.so | grep -q "ARM aarch64"

          zip -r dist/VertictHub-Studio-Source.zip . -x ".git/*" "dist/*" "app/build/*" ".gradle/*"
          (cd dist && sha256sum VertictHub-Studio.apk VertictHub-Studio-Source.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: 10. Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VertictHub-Studio-ARM64-Release
          path: |
            dist/VertictHub-Studio.apk
            dist/VertictHub-Studio-Source.zip
            dist/SHA256SUMS.txt
